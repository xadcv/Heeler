# Android companion app (android/**), refs ADR 0017.
#
# Ubuntu only: the pure-JVM `:herdr` and `:ssh` suites run without an
# emulator, the transport E2E suite runs against two unprivileged sshd
# instances plus the shared fake-herdr fixture, and rendered UI is checked
# with Compose Preview screenshot tests against committed references.
# Nothing here needs KVM. iOS CI stays in ci.yml; plugin/relay/codegen stay
# in ci-node.yml (codegen drift there also covers the Kotlin wire types
# because the generator emits both from one snapshot).

name: CI (Android)

on:
  pull_request:
    paths:
      - android/**
      - scripts/fixtures/fake-herdr-streamlocal.py
      - plugin/test-vectors/**
      - .github/workflows/ci-android.yml
  push:
    branches: [main]
    paths:
      - android/**
      - scripts/fixtures/fake-herdr-streamlocal.py
      - plugin/test-vectors/**
      - .github/workflows/ci-android.yml

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Gradle (JVM tests, transport E2E, APK, screenshots)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37 build-tools;37.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - name: Wire, events and domain tests
        run: ./gradlew :herdr:test --console=plain
      - name: Transport E2E against real sshd
        # ubuntu-latest ships openssh-server binaries but no running daemon;
        # the script starts its own unprivileged instances on loopback.
        run: |
          sudo apt-get install -y --no-install-recommends openssh-server
          ./scripts/run-transport-e2e.sh --console=plain
      - name: Debug APK and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug --console=plain
      - name: Screenshot references
        run: ./gradlew :app:validateDebugScreenshotTest --console=plain
      - name: Upload screenshot report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-report
          path: android/app/build/reports/screenshotTest/
          if-no-files-found: ignore
