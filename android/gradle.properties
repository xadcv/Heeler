org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
# Release builds are not R8-minified yet; the JSch keep rules land with them.
android.nonTransitiveRClass=true
# Host-side Compose Preview screenshot tests (`:app:validateDebugScreenshotTest`):
# the only rendered-UI check that runs without an emulator.
android.experimental.enableScreenshotTest=true
android.compose.screenshot.maxHeapSize=3g
